# hyprlock — Catppuccin Mocha, matched to waybar/style.css and wofi.
# Palette: https://catppuccin.com/palette (Mocha)

general {
    hide_cursor = true
    # No grace / no_fade_in here: hyprlock 0.9 has neither config key. Grace is
    # the --grace command-line flag now (`hyprlock --grace 30` to test safely).

    # Enter on an empty box is not a wrong password. Without this it counts as
    # one, and Arch locks you out for 10 minutes after 3 (see scripts/lock-hint).
    # Easy to do by accident: pressing Enter to wake the screen, or typing while
    # a try is still being checked, which hyprlock ignores, then hitting Enter.
    ignore_empty_input = true

    # How long a failure message stays up, in ms. The 2 s default is gone
    # before "locked for 10 minutes" can be read.
    fail_timeout = 6000
}

background {
    monitor =
    # Grabs the current frame of the video wallpaper and blurs it, so the lock
    # screen always matches whatever the desktop was showing.
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.17
}

# --- clock ---
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(cdd6f4ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(b4befeff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

# --- who's logged in ---
label {
    monitor =
    text =   $USER
    color = rgba(cba6f7ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# --- password field ---
# Shape mirrors the Waybar pills: 14px radius, 2px border, translucent base.
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(89b4faee)
    inner_color = rgba(1e1e2ee0)
    font_color  = rgba(cdd6f4ff)

    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Password</span>
    hide_input = false
    rounding = 14

    # While a password is being checked (~2 s after a wrong one), keys are
    # ignored, so say so instead of leaving an empty box to type into.
    check_color = rgba(f9e2afff)
    check_text  = <span foreground="##f9e2af">Checking…</span>
    fail_color  = rgba(f38ba8ff)
    fail_text   = <span foreground="##f38ba8">$FAIL</span>
    # Peach outline while Caps Lock is on. Unset, hyprlock reuses fail_color,
    # which looks exactly like a wrong password.
    capslock_color = rgba(fab387ff)

    position = 0, -60
    halign = center
    valign = center
}

# --- warnings under the password box: Caps Lock, last try, locked out ---
# Prints nothing (so this label is invisible) unless there's something to say.
label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/lock-hint
    text_align = center
    color = rgba(fab387ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -125
    halign = center
    valign = center
}

# --- battery, bottom right ---
label {
    monitor =
    text = cmd[update:30000] printf "%s%%" "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"
    color = rgba(89b4faff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -30, 24
    halign = right
    valign = bottom
}
