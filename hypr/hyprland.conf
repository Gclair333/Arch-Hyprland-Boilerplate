monitor=,preferred,auto,auto

exec-once = waybar

# --- wallpaper ---
# mpvpaper (video-capable) with awww as an automatic fallback: if wallpaper-start
# fails for any reason, the || arm restores the old static wallpaper rather than
# leaving a bare desktop. wallpaper-start waits for its IPC socket before
# returning, so anything that talks to it can't race the daemon.
#
# Ambient source order: $MPVPAPER_AMBIENT -> ~/Videos/wallpaper.mp4 ->
# ~/Pictures/wallpaper.jpg (still-image fallback). Currently playing
# wallpaper.mp4, transcoded to 1920x1080@30 to match the panel — the original
# 1440p60 source is kept at ~/Videos/wallpaper-original.mp4.
#
# Previous line, kept for one session as a manual fallback:
#   exec-once = awww-daemon && awww img ~/Pictures/wallpaper.jpg
exec-once = ~/.config/scripts/wallpaper-start --quiet || (awww-daemon && awww img ~/Pictures/wallpaper.jpg)

# Auto-resume the last episode a few seconds after login, once the session has
# settled. It lands PAUSED and MUTED on the frame you left off at — press
# SUPER+P to start it, or SUPER SHIFT+A for sound. Does nothing (silently) when
# there's no episode to resume, which is most logins.
# The delay matters: resuming re-runs anipy-cli, which is a live network scrape,
# so it shouldn't be competing with the rest of session startup.
# To disable, comment this out; SUPER+R still resumes on demand.
# To have it start playing immediately, add MPVPAPER_AUTORESUME_PLAY=1.
#
# DISABLED 2026-10-20: animehub (anipy-cli's provider) can no longer resolve
# streams, so this failed at every login — and the failed attempt's cleanup
# reloads the ambient wallpaper mid-startup, the likely cause of the wallpaper
# freezing on its first frame. Uncomment once a working source is back.
# exec-once = sh -c 'sleep 10; ~/.config/scripts/wallpaper-resume --auto'

# Pauses the video wallpaper while the screen is locked or the machine is
# suspended, and resumes after. Listens to logind, so it catches every lock
# path — hyprlock, `loginctl lock-session`, and hypridle's idle timeout alike.
# It only resumes what it paused, so a wallpaper you paused with SUPER+P stays
# paused through a lock cycle.
exec-once = ~/.config/scripts/wallpaper-lock-watch

# Idle timeouts (dim -> lock -> screen off). Reads hypridle.conf.
exec-once = hypridle

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

input {
	kb_layout = us
	follow_mouse = 1
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(89b4faee)
	col.inactive_border = rgba(585b70aa)
}

decoration {
	rounding = 10

	active_opacity = 1.0
	inactive_opacity = 0.94

	blur {
		enabled = true
		size = 4
		passes = 2
	}

	shadow {
		enabled = true
		range = 14
		render_power = 3
		color = rgba(11111b99)
	}
}

# Frosts the translucent parts of the bar and launcher. ignore_alpha keeps the
# fully-transparent bar background out of it, so only the pills get blurred.
# Note: this is the Hyprland 0.53+ rule syntax (blur takes on/off, and the
# target is matched with match:namespace).
layerrule = blur on, ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, ignore_alpha 0.3, match:namespace wofi

animations {
	enabled = yes

	bezier = smooth, 0.05, 0.9, 0.1, 1.0
	bezier = snappy, 0.2, 1.0, 0.2, 1.0

	animation = windows, 1, 4, snappy, popin 90%
	animation = windowsOut, 1, 4, smooth, popin 90%
	animation = fade, 1, 5, smooth
	animation = border, 1, 8, default
	animation = workspaces, 1, 4, snappy, slide
}

bind = SUPER, Return, exec, kitty
bind = SUPER, Q, killactive
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating

# --- workspaces ---
# 1-5 matches the persistent-workspaces count in waybar/config; extend both
# together if you want more.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Send the focused window to a workspace.
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Cycle workspaces with SUPER + mouse wheel.
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# --- "minimize" via the special workspace (scratchpad) ---
# Hyprland has no minimize; instead, stash a window on an off-screen workspace
# and toggle it back into view over whatever you're doing.
bind = SUPER, M, movetoworkspacesilent, special:magic
bind = SUPER SHIFT, M, togglespecialworkspace, magic
# Un-stash: pulls the focused window onto the current workspace so it tiles
# with what's already there, instead of floating over it. Reveal the scratchpad
# (SUPER SHIFT M), focus the window you want, then this.
bind = SUPER CTRL, M, movetoworkspace, +0

# --- move focus between tiled windows (arrows or vim keys) ---
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# --- move the focused window within the layout ---
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# --- resize the focused window ---
bind = SUPER CTRL, left, resizeactive, -40 0
bind = SUPER CTRL, right, resizeactive, 40 0
bind = SUPER CTRL, up, resizeactive, 0 -40
bind = SUPER CTRL, down, resizeactive, 0 40

# --- drag and resize windows with the mouse ---
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# --- session ---
bind = SUPER SHIFT, E, exit
# Via loginctl rather than calling hyprlock directly: logind then emits the Lock
# signal that wallpaper-lock-watch listens for, so the wallpaper pauses too.
bind = SUPER SHIFT, L, exec, loginctl lock-session

# --- screenshots (requires: grim slurp wl-clipboard) ---
bind = , Print, exec, ~/.config/scripts/screenshot.sh screen
bind = SUPER, S, exec, ~/.config/scripts/screenshot.sh region
bind = SUPER SHIFT, S, exec, ~/.config/scripts/screenshot.sh region-save

# --- video wallpaper / anime ---
# The wallpaper layer can't take keyboard focus, so mpv's usual keys (space,
# arrows) never reach it. Everything here goes through the IPC socket instead.
# All of these no-op harmlessly when mpvpaper isn't running.
bind = SUPER, A, exec, kitty -e ~/.config/scripts/watch-anime-anipy
bind = SUPER SHIFT, A, exec, ~/.config/scripts/wallpaper-audio toggle
# Pick up the last episode where it left off — survives logout/reboot/poweroff.
# Deliberately a keypress, not a login action: resuming re-runs anipy-cli (a live
# network scrape), and auto-playing anime with sound at login would be worse.
# Retargeted 2026-09-11: ani-cli's only backend (anidb.app) went dark, so both
# this and SUPER+A now go through anipy-cli. See Rice_Notes/Next-Steps.txt.
bind = SUPER, R, exec, kitty -e ~/.config/scripts/wallpaper-resume
bind = SUPER, P, exec, ~/.config/scripts/mpvpaper-ipc cycle pause
bind = SUPER, bracketleft, exec, ~/.config/scripts/mpvpaper-ipc seek -10 relative
bind = SUPER, bracketright, exec, ~/.config/scripts/mpvpaper-ipc seek 10 relative

# --- media keys ---
# bindel repeats while held; bindl keeps working on a lock screen.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- brightness (requires: brightnessctl) ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# (The Waybar network pill opens a wofi-based Wi-Fi picker, not a window,
#  so no float rule is needed for it.)
