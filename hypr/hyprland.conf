monitor=,preferred,auto,auto

exec-once = waybar
# Chained, so the image request can't race the daemon's IPC socket at login.
exec-once = awww-daemon && awww img ~/Pictures/wallpaper.jpg

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

input {
	kb_layout = us
	follow_mouse = 1
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(89b4faee)
	col.inactive_border = rgba(585b70aa)
}

decoration {
	rounding = 10

	active_opacity = 1.0
	inactive_opacity = 0.94

	blur {
		enabled = true
		size = 4
		passes = 2
	}

	shadow {
		enabled = true
		range = 14
		render_power = 3
		color = rgba(11111b99)
	}
}

# Frosts the translucent parts of the bar and launcher. ignore_alpha keeps the
# fully-transparent bar background out of it, so only the pills get blurred.
# Note: this is the Hyprland 0.53+ rule syntax (blur takes on/off, and the
# target is matched with match:namespace).
layerrule = blur on, ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, ignore_alpha 0.3, match:namespace wofi

animations {
	enabled = yes

	bezier = smooth, 0.05, 0.9, 0.1, 1.0
	bezier = snappy, 0.2, 1.0, 0.2, 1.0

	animation = windows, 1, 4, snappy, popin 90%
	animation = windowsOut, 1, 4, smooth, popin 90%
	animation = fade, 1, 5, smooth
	animation = border, 1, 8, default
	animation = workspaces, 1, 4, snappy, slide
}

bind = SUPER, Return, exec, kitty
bind = SUPER, Q, killactive
bind = SUPER, R, exec, wofi --show drun
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating

# --- workspaces ---
# 1-5 matches the persistent-workspaces count in waybar/config; extend both
# together if you want more.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Send the focused window to a workspace.
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Cycle workspaces with SUPER + mouse wheel.
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
