monitor=,preferred,auto,auto

exec-once = waybar

# --- wallpaper ---
# mpvpaper (video-capable) with awww as an automatic fallback: if wallpaper-start
# fails for any reason, the || arm restores the old static wallpaper rather than
# leaving a bare desktop. wallpaper-start waits for its IPC socket before
# returning, so anything that talks to it can't race the daemon.
#
# Ambient source order: $MPVPAPER_AMBIENT -> ~/Videos/wallpaper.mp4 ->
# ~/Pictures/wallpaper.jpg (still-image fallback). Encode the video to match
# the panel: a 1440p60 source on a 1080p laptop cost ~20% CPU and dropped
# frames, versus ~13% and none once transcoded to 1080p30 (see the README).
exec-once = ~/.config/scripts/wallpaper-start --quiet || (awww-daemon && awww img ~/Pictures/wallpaper.jpg)

# Auto-resume the last episode a few seconds after login, once the session has
# settled. It lands PAUSED and MUTED on the frame you left off at — press
# SUPER+P to start it, or SUPER SHIFT+A for sound. Does nothing (silently) when
# there's no episode to resume, which is most logins.
# The delay matters: resuming re-runs anipy-cli, which is a live network scrape,
# so it shouldn't be competing with the rest of session startup.
# To disable, comment this out; SUPER+R still resumes on demand.
# To have it start playing immediately, add MPVPAPER_AUTORESUME_PLAY=1.
#
# DISABLED 2026-10-20: animehub (anipy-cli's provider) can no longer resolve
# streams, so this failed at every login — and the failed attempt's cleanup
# reloads the ambient wallpaper mid-startup, the likely cause of the wallpaper
# freezing on its first frame. Resume goes through ani-cli now, which works
# again from 5.1: once SUPER+R resumes an episode, this is safe to uncomment.
# exec-once = sh -c 'sleep 10; ~/.config/scripts/wallpaper-resume --auto'

# Pauses the video wallpaper while the screen is locked or the machine is
# suspended, and resumes after. Listens to logind, so it catches every lock
# path — hyprlock, `loginctl lock-session`, and hypridle's idle timeout alike.
# It only resumes what it paused, so a wallpaper you paused with SUPER+P stays
# paused through a lock cycle.
exec-once = ~/.config/scripts/wallpaper-lock-watch

# Idle timeouts (dim -> lock -> screen off). Reads hypridle.conf.
exec-once = hypridle

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

input {
	kb_layout = us
	follow_mouse = 1
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(89b4faee)
	col.inactive_border = rgba(585b70aa)
}

decoration {
	rounding = 10

	active_opacity = 1.0
	inactive_opacity = 0.94

	blur {
		enabled = true
		size = 4
		passes = 2
	}

	shadow {
		enabled = true
		range = 14
		render_power = 3
		color = rgba(11111b99)
	}
}

# Frosts the translucent parts of the bar and launcher. ignore_alpha keeps the
# fully-transparent bar background out of it, so only the pills get blurred.
# Note: this is the Hyprland 0.53+ rule syntax (blur takes on/off, and the
# target is matched with match:namespace).
layerrule = blur on, ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, ignore_alpha 0.3, match:namespace wofi

animations {
	enabled = yes

	bezier = smooth, 0.05, 0.9, 0.1, 1.0
	bezier = snappy, 0.2, 1.0, 0.2, 1.0

	animation = windows, 1, 4, snappy, popin 90%
	animation = windowsOut, 1, 4, smooth, popin 90%
	animation = fade, 1, 5, smooth
	animation = border, 1, 8, default
	animation = workspaces, 1, 4, snappy, slide
}

bindd = SUPER, Return, Open terminal (kitty), exec, kitty
bindd = SUPER, Q, Close window, killactive
bindd = SUPER, D, App launcher, exec, wofi --show drun
bindd = SUPER, F, Fullscreen on/off, fullscreen
bindd = SUPER, V, Float / tile window, togglefloating

# --- workspaces ---
# 1-5 matches the persistent-workspaces count in waybar/config; extend both
# together if you want more.
bindd = SUPER, 1, Go to workspace 1, workspace, 1
bindd = SUPER, 2, Go to workspace 2, workspace, 2
bindd = SUPER, 3, Go to workspace 3, workspace, 3
bindd = SUPER, 4, Go to workspace 4, workspace, 4
bindd = SUPER, 5, Go to workspace 5, workspace, 5

# Send the focused window to a workspace.
bindd = SUPER SHIFT, 1, Send window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Send window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Send window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Send window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Send window to workspace 5, movetoworkspace, 5

# Cycle workspaces with SUPER + mouse wheel.
bindd = SUPER, mouse_down, Next workspace, workspace, e+1
bindd = SUPER, mouse_up, Previous workspace, workspace, e-1

# --- "minimize" via the special workspace (scratchpad) ---
# Hyprland has no minimize; instead, stash a window on an off-screen workspace
# and toggle it back into view over whatever you're doing.
bindd = SUPER, M, Stash window (minimize), movetoworkspacesilent, special:magic
bindd = SUPER SHIFT, M, Show / hide stashed windows, togglespecialworkspace, magic
# Un-stash: pulls the focused window onto the current workspace so it tiles
# with what's already there, instead of floating over it. Reveal the scratchpad
# (SUPER SHIFT M), focus the window you want, then this.
bindd = SUPER CTRL, M, Unstash window onto this workspace, movetoworkspace, +0

# --- move focus between tiled windows (arrows or vim keys) ---
bindd = SUPER, left, Focus window to the left, movefocus, l
bindd = SUPER, right, Focus window to the right, movefocus, r
bindd = SUPER, up, Focus window above, movefocus, u
bindd = SUPER, down, Focus window below, movefocus, d
bindd = SUPER, H, Focus window to the left, movefocus, l
bindd = SUPER, J, Focus window below, movefocus, d
bindd = SUPER, K, Focus window above, movefocus, u
bindd = SUPER, L, Focus window to the right, movefocus, r

# --- move the focused window within the layout ---
bindd = SUPER SHIFT, left, Move window left, movewindow, l
bindd = SUPER SHIFT, right, Move window right, movewindow, r
bindd = SUPER SHIFT, up, Move window up, movewindow, u
bindd = SUPER SHIFT, down, Move window down, movewindow, d

# --- resize the focused window ---
bindd = SUPER CTRL, left, Make window narrower, resizeactive, -40 0
bindd = SUPER CTRL, right, Make window wider, resizeactive, 40 0
bindd = SUPER CTRL, up, Make window shorter, resizeactive, 0 -40
bindd = SUPER CTRL, down, Make window taller, resizeactive, 0 40

# --- drag and resize windows with the mouse ---
bindmd = SUPER, mouse:272, Drag to move window, movewindow
bindmd = SUPER, mouse:273, Drag to resize window, resizewindow

# --- session ---
bindd = SUPER SHIFT, E, Log out (exit Hyprland), exit
# Via loginctl rather than calling hyprlock directly: logind then emits the Lock
# signal that wallpaper-lock-watch listens for, so the wallpaper pauses too.
bindd = SUPER SHIFT, L, Lock screen, exec, loginctl lock-session

# --- screenshots (requires: grim slurp wl-clipboard) ---
bindd = , Print, Screenshot: whole screen to clipboard, exec, ~/.config/scripts/screenshot.sh screen
bindd = SUPER, S, Screenshot: region to clipboard, exec, ~/.config/scripts/screenshot.sh region
bindd = SUPER SHIFT, S, Screenshot: region to clipboard + Pictures, exec, ~/.config/scripts/screenshot.sh region-save

# --- video wallpaper / anime ---
# The wallpaper layer can't take keyboard focus, so mpv's usual keys (space,
# arrows) never reach it. Everything here goes through the IPC socket instead.
# All of these no-op harmlessly when mpvpaper isn't running.
bindd = SUPER, A, Watch anime on the wallpaper, exec, kitty -e ~/.config/scripts/watch-anime
bindd = SUPER SHIFT, A, Wallpaper sound on/off, exec, ~/.config/scripts/wallpaper-audio toggle
# Pick up the last episode where it left off — survives logout/reboot/poweroff.
# Deliberately a keypress, not a login action: resuming re-runs the search (a
# live network scrape), and auto-playing anime with sound at login would be worse.
# Back on ani-cli since 2026-10-20: 5.1 replaced the dead anidb.app with a
# working provider (hianime), while anipy-cli's animehub stopped resolving
# streams. watch-anime-anipy still works by hand if that flips again.
bindd = SUPER, R, Resume last episode, exec, kitty -e ~/.config/scripts/wallpaper-resume
bindd = SUPER, P, Pause / play the wallpaper, exec, ~/.config/scripts/mpvpaper-ipc cycle pause
bindd = SUPER, bracketleft, Wallpaper: back 10 seconds, exec, ~/.config/scripts/mpvpaper-ipc seek -10 relative
bindd = SUPER, bracketright, Wallpaper: forward 10 seconds, exec, ~/.config/scripts/mpvpaper-ipc seek 10 relative

# --- media keys ---
# bindel repeats while held; bindl keeps working on a lock screen (the d on
# the end of each, as everywhere here, means the bind has a description).
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute / unmute sound, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute / unmute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindld = , XF86AudioPlay, Play / pause media, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# --- brightness ---
# Through logind (scripts/backlight), the same way the Waybar slider works, so
# no brightnessctl or video group is needed.
bindeld = , XF86MonBrightnessUp, Brightness up, exec, ~/.config/scripts/backlight up 5
bindeld = , XF86MonBrightnessDown, Brightness down, exec, ~/.config/scripts/backlight down 5

# --- settings ---
# Same menu as the gear in the bar. SUPER+I, as on Windows.
bindd = SUPER, I, Settings, exec, ~/.config/scripts/settings-menu.sh

# --- keyboard shortcuts ---
# A searchable list of every shortcut, built live from `hyprctl binds`. It shows
# the description given to each bind above (bindd = MODS, KEY, Description, ...),
# so give new binds one too: a bind without it is listed by its raw command.
bindd = SUPER, slash, Keyboard shortcuts (this list), exec, ~/.config/scripts/keybinds-menu.sh

# (The Waybar network pill opens a wofi-based Wi-Fi picker, not a window,
#  so no float rule is needed for it.)

# --- your Settings-menu choices ---
# The Settings menu (gear in the bar, or SUPER+I) saves what you change to
# settings.conf. It's read last, so it wins over everything above; delete a
# line there to get this file's value back. It only exists once you've changed
# something, and the noerror lines stop its absence from counting as an error.
# hyprlang noerror true
source = ~/.config/hypr/settings.conf
# hyprlang noerror false
