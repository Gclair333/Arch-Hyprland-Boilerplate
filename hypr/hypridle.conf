# hypridle — idle timeouts.
#
# Note the deliberate use of `loginctl lock-session` rather than calling
# hyprlock directly: going through logind makes it emit the Lock signal, which
# is what wallpaper-lock-watch listens for to pause the video wallpaper. Calling
# hyprlock straight would lock the screen but leave the wallpaper decoding
# behind it.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the backlight as a warning shot before locking.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# Lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off shortly after locking.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
