# hypridle — idle timeouts: dim -> lock -> screen off (and sleep, if enabled).
#
# Note the deliberate use of `loginctl lock-session` rather than calling
# hyprlock directly: going through logind makes it emit the Lock signal, which
# is what wallpaper-lock-watch listens for to pause the video wallpaper. Calling
# hyprlock straight would lock the screen but leave the wallpaper decoding
# behind it.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# --- timings ---
# Seconds without keyboard or mouse input. An empty value turns that step off.
# These are the defaults: the Settings menu (the gear in the bar) saves your
# own choices to settings-idle.conf, which is read next and wins over them.
$dim_after        = 240
$lock_after       = 300
$screen_off_after = 330
$sleep_after      =

# Asked before every step below; while it answers no, hypridle holds off and
# asks again every 30 s. This one says no while an episode plays on the video
# wallpaper (watching looks idle, and mpvpaper doesn't keep the screen awake
# itself). It answers yes when there's no wallpaper, or no script: a missing
# check must never stop the screen locking. Empty = never hold off.
$ok_to_idle = test ! -x ~/.config/scripts/wallpaper-idle-ok || ~/.config/scripts/wallpaper-idle-ok

# settings-idle.conf only exists once you've changed something in Settings;
# the noerror lines stop its absence from being reported as an error.
# hyprlang noerror true
source = ~/.config/hypr/settings-idle.conf
# hyprlang noerror false

# Each step below only exists while its timing is set: "# hyprlang if X"
# skips everything up to its endif when $X is empty.

# Dim the backlight as a warning shot before locking. scripts/backlight goes
# through logind, so this works without brightnessctl.
# hyprlang if dim_after
listener {
    timeout = $dim_after
    condition_cmd   = $ok_to_idle
    condition_retry = 30
    on-timeout = ~/.config/scripts/backlight dim 15
    on-resume  = ~/.config/scripts/backlight restore
}
# hyprlang endif

# Lock.
# hyprlang if lock_after
listener {
    timeout = $lock_after
    condition_cmd   = $ok_to_idle
    condition_retry = 30
    on-timeout = loginctl lock-session
}
# hyprlang endif

# Screen off.
# hyprlang if screen_off_after
listener {
    timeout = $screen_off_after
    condition_cmd   = $ok_to_idle
    condition_retry = 30
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
# hyprlang endif

# Sleep (suspend). Off by default. before_sleep_cmd above locks first.
# hyprlang if sleep_after
listener {
    timeout = $sleep_after
    condition_cmd   = $ok_to_idle
    condition_retry = 30
    on-timeout = systemctl suspend
}
# hyprlang endif
